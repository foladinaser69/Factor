prod(){return S.pr.map(p=>`<div class="ro" onclick="prForm(${p.id})"><div>${fa(p.p)} ${S.st.cur}</div><div style="text-align:right;flex:1"><b>${esc(p.name)}</b><div class="mu">${esc(p.u)} ${esc(p.code||'')}</div></div></div>`).join('')||'<div class="card mu">کالایی ثبت نشده.</div>'},
repOld0(){const tabs=[['sum','خلاصه'],['cus','به تفکیک مشتری'],['prd','به تفکیک کالا'],['deb','بدهکاران'],['cre','بستانکاران'],['cash','دریافت و پرداخت'],['opn','تسویه نشده'],['st','صورتحساب مشتری'],['pf','پیش فاکتورها'],['buy','خرید']];
const iv=t=>S.iv.filter(v=>v.type==t&&inR(v.date)),sl=iv('sale');let h='';const cur=S.st.cur;

else if(RT=='deb'||RT=='cre'){const d=RT=='deb',r=S.cu.map(c=>[c,bal(c.id)]).filter(x=>d?x[1]>0:x[1]<0);h=tb(['مشتری','تلفن','مبلغ'],r.map(x=>[esc(x[0].name),esc(x[0].tel||''),fa(Math.abs(x[1]))]),['جمع','',fa(sum(r,x=>Math.abs(x[1])))])}
else if(RT=='cash'){const r=[];S.pm.filter(p=>inR(p.date)).forEach(p=>r.push([p.date,p.t,cn(p.cid),p.m,p.a]));S.iv.filter(v=>v.type!='pre'&&inR(v.date)).forEach(v=>{const k=calc(v),t=v.type=='sale'?'rec':'pay';if(k.cash)r.push([v.date,t,cn(v.cid),'نقدی (فاکتور '+fn(v.no)+')',k.cash]);if(k.chq)r.push([v.date,t,cn(v.cid),'چک (فاکتور '+fn(v.no)+')',k.chq])});r.sort((a,b)=>a[0]>b[0]?1:-1);const R=sum(r.filter(x=>x[1]=='rec'),x=>x[4]),Pp=sum(r.filter(x=>x[1]=='pay'),x=>x[4]);h=tb(['تاریخ','نوع','طرف حساب','روش','مبلغ'],r.map(x=>[fn(x[0]),x[1]=='rec'?'دریافت':'پرداخت',esc(x[2]),esc(x[3]),fa(x[4])]),['جمع دریافت',fa(R),'جمع پرداخت',fa(Pp),'خالص '+fa(R-Pp)])}

else if(RT=='pf'||RT=='buy'){const r=iv(RT=='pf'?'pre':'buy');h=tb(['شماره','مشتری','تاریخ','مبلغ','وضعیت'],r.map(v=>[fn(v.no),esc(cn(v.cid)),fn(v.date),fa(calc(v).tot),SN[st(v)]]),['','','جمع',fa(sum(r,v=>calc(v).tot)),''])}

set(){const s=S.st,t=(k,l,ty)=>`<label>${l}<input ${ty?'inputmode="decimal"':''} value="${esc(s[k])}" oninput="S.st.${k}=${ty?'num(this.value)':'this.value'};save()"></label>`,ck=(k,l)=>`<label style="color:var(--t)"><input type="checkbox" style="width:auto" ${s[k]?'checked':''} onchange="S.st.${k}=this.checked;save()"> ${l}</label>`,im=(k,l)=>`<label>${l}<input type="file" accept="image/*" onchange="img(this,'${k}')"></label>${s[k]?`<img src="${s[k]}" style="height:60px;background:#fff"> <button class="sb db" onclick="S.st.${k}='';save();draw()">حذف</button>`:''}`;
return `<h4>اطلاعات کسب و کار</h4><div class="card">${t('name','نام کسب و کار')}${t('addr','آدرس')}${t('tel','تلفن')}${t('cur','واحد پول (ریال / تومان)')}${im('logo','لوگو')}</div>

<div class="row"><label>شماره بعدی پیش‌فاکتور<input value="${s.n.pre}" oninput="S.st.n.pre=num(this.value);save()"></label><label>شماره بعدی فروش<input value="${s.n.sale}" oninput="S.st.n.sale=num(this.value);save()"></label><label>شماره بعدی خرید<input value="${s.n.buy}" oninput="S.st.n.buy=num(this.value);save()"></label></div>
<label>واحدهای شمارش (با ویرگول جدا کنید)<input value="${esc(s.units.join('،'))}" oninput="S.st.units=this.value.split(/[,،]/).map(x=>x.trim()).filter(Boolean);save()"></label></div>
<h4>مهر و امضا</h4><div class="card">${im('stamp','تصویر مهر')}<div style="margin-top:12px"><label>امضا</label>${s.sign?`<img src="${s.sign}" style="height:60px;background:#fff;display:block;margin-bottom:6px">`:''}<button class="pb" onclick="go('sg')">${s.sign?'امضای دوباره':'ثبت امضا'}</button>${s.sign?` <button class="sb db" onclick="S.st.sign='';save();draw()">حذف</button>`:''}</div></div>
<h4>حساب‌های بانکی</h4>${s.banks.map((b,i)=>`<div class="ro" onclick="bkForm(${i})"><div style="text-align:right"><b>${esc(b.bank)}</b><div class="mu">${esc(b.card||b.acc||'')} ${esc(b.owner||'')}</div></div></div>`).join('')}<div class="card"><button class="pb" onclick="bkForm(-1)">+ افزودن حساب</button></div>
<h4>پشتیبان‌گیری</h4><div class="card mu">داده‌ها فقط در همین مرورگر ذخیره می‌شوند؛ حتماً پشتیبان بگیرید.<div class="card" style="margin:0 0 10px;padding:0;border:0"><div style="color:var(--t)"><b>فایل داده (JSON)</b></div><div class="mu" style="margin:4px 0 8px">تمام اطلاعات در یک فایل جدا ذخیره می‌شود: در اپ نصب‌شده خودکار در Documents/FaktorApp/data.json؛ در مرورگر با دکمه زیر فایل دانلود/اشتراک می‌شود.</div><div class="row"><button class="pb" onclick="exportData()">ذخیره فایل داده</button><label class="sb" style="text-align:center;margin:0;cursor:pointer;color:var(--t);font-size:14px">بازیابی از فایل<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div><button class="sb" style="margin:8px 0" onclick="linkFile()">اتصال به فایل (ذخیره خودکار)</button></div><textarea id="bk"></textarea><div class="row" style="margin-top:8px"><button class="sb" onclick="$('#bk').value=JSON.stringify(S)">نمایش پشتیبان (کپی کنید)</button><button class="sb" onclick="try{S=JSON.parse($('#bk').value);save();go('set');toast('بازیابی شد')}catch(e){toast('متن نامعتبر')}">بازیابی</button></div></div>`}};
